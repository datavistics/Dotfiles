# Good terminal and colour support
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Better interactive/TUI behaviour
set -sg escape-time 10
set -g focus-events on
set -g mouse on
set -g set-clipboard on

# Keep plenty of Codex output available
set -g history-limit 100000

# Clean up window numbering
set -g renumber-windows on
setw -g automatic-rename on

# Open new panes/windows in the current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Reload this file with Ctrl-b, then r
bind r source-file ~/.tmux.conf \; display-message "tmux configuration reloaded"
